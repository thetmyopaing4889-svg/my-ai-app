<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Architect</title>
    <style>
        /* CSS Reset & Dark Mode */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        
        body { 
            background-color: #0f0f0f; 
            color: #ffffff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        /* Header */
        .header { 
            flex-shrink: 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 20px; 
            background: #0f0f0f; 
            border-bottom: 1px solid #222; 
            position: relative; 
            z-index: 10; 
        }
        .menu-btn { font-size: 24px; cursor: pointer; color: #aaa; }
        .header-center { text-align: center; flex-grow: 1; }
        .header-title { font-weight: 600; font-size: 16px; }
        .header-mode { font-size: 12px; color: #888; margin-top: 2px; }
        .new-chat-btn { width: 32px; height: 32px; border-radius: 50%; background: #1e1e1e; border: 1px solid #333; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }

        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #171717; z-index: 20; transition: left 0.3s ease; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #222; }
        .sidebar.open { left: 0; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 15; display: none; }
        .sidebar-overlay.open { display: block; }
        .search-bar { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; margin-bottom: 20px; }
        .session-list { flex-grow: 1; overflow-y: auto; }
        .session-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .session-item:hover { background: #222; }
        .delete-btn { color: #ff4444; cursor: pointer; font-size: 14px; }
        .sidebar-footer { border-top: 1px solid #222; padding-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .username { font-size: 14px; font-weight: 500; }
        .settings-btn { font-size: 20px; cursor: pointer; color: #888; }

        /* Main Chat Area */
        .chat-area { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
            padding-bottom: 80px; 
        }
        
        /* Empty State */
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; text-align: center; }
        .logo-placeholder { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #4a90e2, #7c3aed); margin-bottom: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: white; }
        .empty-text { font-size: 18px; font-weight: 500; margin-bottom: 20px; }
        .mode-pills { display: flex; gap: 10px; }
        .pill-btn { padding: 8px 20px; border-radius: 20px; border: 1px solid #333; background: transparent; color: #aaa; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .pill-btn.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
        
        /* Active Chat */
        .active-chat { display: none; flex-grow: 1; overflow-y: auto; padding: 20px; flex-direction: column; }
        .message-row { display: flex; margin-bottom: 15px; }
        .message-row.user { justify-content: flex-end; }
        .message-row.ai { justify-content: flex-start; }
        .message-bubble { max-width: 80%; padding: 10px 15px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
        .message-bubble.user { background: #2b2b2b; color: #fff; border-bottom-right-radius: 4px; }
        .message-bubble.ai { background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; border-bottom-left-radius: 4px; }
        .ai-actions { margin-top: 5px; display: flex; gap: 10px; font-size: 12px; color: #888; }
        .ai-actions span { cursor: pointer; }
        
        /* Input Area */
        .input-area { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            padding: 10px 15px; 
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            background: #0f0f0f; 
            border-top: 1px solid #222; 
            display: flex; 
            align-items: flex-end; 
            gap: 10px; 
            z-index: 50; 
        }
        .chat-input-wrapper { 
            flex-grow: 1; 
            display: flex; 
            align-items: flex-end; 
            background: #1e1e1e; 
            border-radius: 24px; 
            padding: 8px 12px; 
            border: 1px solid #333; 
        }
        
        /* Textarea */
        .chat-input-wrapper textarea { 
            flex-grow: 1; 
            background: transparent; 
            border: none; 
            color: #fff; 
            outline: none; 
            font-size: 16px; 
            padding: 5px 0; 
            resize: none; 
            overflow: hidden; 
            min-height: 24px; 
            max-height: 120px; 
            line-height: 1.5;
            width: 100%;
            font-family: inherit;
        }
        
        /* Circular + Button for File Upload */
        .attach-btn { 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            background: #2a2a2a; 
            border: none; 
            color: #aaa; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
            cursor: pointer; 
            align-self: center; 
            flex-shrink: 0; 
            margin-right: 8px;
        }
        .attach-btn:hover { background: #333; }

        .action-row { display: flex; align-items: center; gap: 10px; align-self: center; }
        
        /* Debate Toggle UI */
        .debate-toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #888; cursor: pointer; }
        .toggle-switch { width: 30px; height: 16px; background: #333; border-radius: 10px; position: relative; cursor: pointer; transition: 0.2s; }
        .toggle-switch.on { background: #4a90e2; }
        .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: #fff; border-radius: 50%; transition: 0.2s; }
        .toggle-switch.on::after { left: 16px; }
        
        .send-btn { width: 40px; height: 40px; border-radius: 50%; background: #4a90e2; border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
        
        /* Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <input type="text" class="search-bar" placeholder="Search sessions...">
        <div class="session-list" id="sessionList">
            <div class="session-item">
                <span>Project: AI App Builder</span>
                <span class="delete-btn">🗑️</span>
            </div>
        </div>
        <div class="sidebar-footer">
            <span class="username">CEO User</span>
            <span class="settings-btn">•••</span>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="menu-btn" onclick="toggleSidebar()">☰</div>
        <div class="header-center">
            <div class="header-title">AI Architect</div>
            <div class="header-mode" id="headerMode">General</div>
        </div>
        <div class="new-chat-btn" onclick="newChat()">+</div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <div class="logo-placeholder">AI</div>
            <div class="empty-text" id="emptyText">Start chatting with General</div>
            <div class="mode-pills">
                <div class="pill-btn active" id="pillGeneral" onclick="setMode('General')">General</div>
                <div class="pill-btn" id="pillProfessional" onclick="setMode('Professional')">Professional</div>
            </div>
        </div>

        <!-- Active Chat History -->
        <div class="active-chat" id="activeChat">
            <div class="message-row user"><div class="message-bubble user">Hello, build a calculator.</div></div>
            <div class="message-row ai"><div class="message-bubble ai">Here is the HTML/CSS code for a calculator...</div></div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="chat-input-wrapper">
            <!-- Circular + Button -->
            <button class="attach-btn" onclick="document.getElementById('fileInput').click()">+</button>
            <!-- Hidden File Input -->
            <input type="file" id="fileInput" style="display:none" accept="image/*, .pdf, .txt" onchange="handleFileUpload(this)">
            
            <textarea id="chatInput" rows="1" placeholder="Ask AI anything..."></textarea>
            
            <div class="action-row">
                <!-- Debate Toggle -->
                <div class="debate-toggle" onclick="toggleDebate()">
                    <span>Debate</span>
                    <div class="toggle-switch" id="debateSwitch"></div>
                </div>
            </div>
        </div>
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        // State
        let isDebateOn = false;
        let currentMode = 'General';
        let attachedFile = null;

        // Sidebar Toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        // Set Mode
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('headerMode').innerText = mode;
            document.getElementById('emptyText').innerText = `Start chatting with ${mode}`;
            
            document.getElementById('pillGeneral').classList.remove('active');
            document.getElementById('pillProfessional').classList.remove('active');
            document.getElementById(mode === 'General' ? 'pillGeneral' : 'pillProfessional').classList.add('active');
        }

        // New Chat
        function newChat() {
            document.getElementById('activeChat').style.display = 'none';
            document.getElementById('emptyState').style.display = 'flex';
            document.getElementById('chatInput').value = '';
            document.getElementById('chatInput').style.height = 'auto'; 
            attachedFile = null; // Reset file
        }

        // Debate Toggle
        function toggleDebate() {
            isDebateOn = !isDebateOn;
            document.getElementById('debateSwitch').classList.toggle('on');
        }

        // Auto-Expand Textarea height
        const chatInput = document.getElementById('chatInput');
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto'; 
            this.style.height = (this.scrollHeight) + 'px'; 
        });

        // Handle File Upload
        function handleFileUpload(input) {
            if (input.files && input.files[0]) {
                attachedFile = input.files[0];
                // ဖိုင်ရွေးပြီးသွားရင် CEO ကြီးကို Alert နဲ့ အသိပေးမယ်
                alert(`📎 File Attached: ${attachedFile.name} (${(attachedFile.size / 1024).toFixed(2)} KB)`);
                // နောက်ပိုင်း Phase တွေမှာ ဒီ File ကို Backend ဆီ ပို့ပြီး AI ကို Process လုပ်ခိုင်းသွားပါမယ်။
            }
        }

        // Send Message
        function sendMessage() {
            const input = document.getElementById('chatInput').value;
            if(!input.trim() && !attachedFile) return;

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('activeChat').style.display = 'flex';

            const chatContainer = document.getElementById('activeChat');
            
            // Construct user message content
            let userContent = input;
            if (attachedFile) {
                userContent += ` (Attached: ${attachedFile.name})`;
            }

            const userMsg = document.createElement('div');
            userMsg.className = 'message-row user';
            userMsg.innerHTML = `<div class="message-bubble user">${userContent}</div>`;
            chatContainer.appendChild(userMsg);

            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message-row ai';
                aiMsg.innerHTML = `
                    <div class="message-bubble ai">
                        This is a mock response from the AI (Phase 1).<br>Code will be added in later phases.<br><br>
                        <div class="ai-actions">
                            <span onclick="alert('Copied!')">📋 Copy</span>
                            <span onclick="alert('Downloaded!')">📥 Download</span>
                        </div>
                    </div>
                `;
                chatContainer.appendChild(aiMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 500);

            // Reset input, height, and file
            document.getElementById('chatInput').value = '';
            document.getElementById('chatInput').style.height = 'auto';
            attachedFile = null;
            document.getElementById('fileInput').value = ''; // Clear file input
        }
    </script>
</body>
</html>
