<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Architect</title>
    <style>
        /* CSS Reset & Dark Mode */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        
        html, body { 
            background-color: #0f0f0f; 
            color: #ffffff; 
            height: 100vh;
            height: -webkit-fill-available;
            width: 100vw;
            overflow: hidden; 
            position: relative;
        }
        
        /* 1. Sidebar (z-index 20 - အပေါ်ဆုံး) */
        .sidebar { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 80%; 
            max-width: 320px; 
            height: 100%; 
            background: #171717; 
            z-index: 20; 
            transform: translateX(-100%); 
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            border-right: 1px solid #222; 
        }
        .sidebar.open { transform: translateX(0); }
        
        .search-bar { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; margin-bottom: 20px; }
        .session-list { flex-grow: 1; overflow-y: auto; }
        .session-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .session-item:hover { background: #222; }
        .delete-btn { color: #ff4444; cursor: pointer; font-size: 14px; }
        .sidebar-footer { border-top: 1px solid #222; padding-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .username { font-size: 14px; font-weight: 500; }
        .settings-btn { font-size: 20px; cursor: pointer; color: #888; }

        /* 2. Overlay (z-index 15 - app-container အပေါ်မှာ) */
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.7); 
            z-index: 15; 
            display: none; 
        }
        .overlay.open { display: block; }

        /* 3. Main App Container (z-index 10 - overlay အောက်မှာ) */
        .app-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #0f0f0f; 
            z-index: 10; 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .app-container.sidebar-open { transform: translateX(80%); } 

        /* Header (z-index 11 - overlay အပေါ်မှာ ဒါပေမယ့် sidebar အောက်မှာ - ခလုတ်တွေနှိပ်လို့ရအောင်) */
        .header { 
            flex-shrink: 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 20px; 
            background: #0f0f0f; 
            border-bottom: 1px solid #222; 
            position: relative; 
            z-index: 11; 
        }
        .menu-btn { font-size: 24px; cursor: pointer; color: #aaa; }
        .header-center { text-align: center; flex-grow: 1; }
        .header-title { font-weight: 600; font-size: 16px; }
        .header-mode { font-size: 12px; color: #888; margin-top: 2px; }
        .new-chat-btn { width: 32px; height: 32px; border-radius: 50%; background: #1e1e1e; border: 1px solid #333; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }

        /* Chat Area */
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; text-align: center; }
        .logo-placeholder { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #4a90e2, #7c3aed); margin-bottom: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: white; }
        .empty-text { font-size: 18px; font-weight: 500; margin-bottom: 20px; }
        .mode-pills { display: flex; gap: 10px; }
        .pill-btn { padding: 8px 20px; border-radius: 20px; border: 1px solid #333; background: transparent; color: #aaa; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .pill-btn.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
        
        .active-chat { display: none; flex-grow: 1; overflow-y: auto; padding: 20px; flex-direction: column; }
        .message-row { display: flex; margin-bottom: 15px; }
        .message-row.user { justify-content: flex-end; }
        .message-row.ai { justify-content: flex-start; }
        .message-bubble { max-width: 80%; padding: 10px 15px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
        .message-bubble.user { background: #2b2b2b; color: #fff; border-bottom-right-radius: 4px; }
        .message-bubble.ai { background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; border-bottom-left-radius: 4px; }
        .ai-actions { margin-top: 5px; display: flex; gap: 10px; font-size: 12px; color: #888; }
        .ai-actions span { cursor: pointer; }
        
        /* Input Area */
        .input-area { 
            position: relative; 
            width: 100%; 
            padding: 10px 15px; 
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            background: #0f0f0f; 
            border-top: 1px solid #222; 
            display: flex; 
            align-items: flex-end; 
            gap: 12px; 
            z-index: 10; 
        }
        
        .input-container { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            background: #1e1e1e; 
            border-radius: 24px; 
            padding: 14px 16px; 
            border: 1px solid #333; 
            min-height: 60px;
            justify-content: space-between;
        }
        .input-top-row { display: flex; align-items: flex-end; width: 100%; }
        .input-top-row textarea { 
            flex-grow: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 16px; padding: 0; resize: none; overflow: hidden; min-height: 24px; max-height: 100px; line-height: 1.5; width: 100%; font-family: inherit; align-self: flex-end; margin-top: 2px;
        }
        .input-bottom-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .bottom-left { display: flex; align-items: center; gap: 10px; }
        .bottom-right { display: flex; align-items: center; gap: 10px; }
        .action-icon-btn { background: transparent; border: none; color: #888; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
        
        .debate-toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #888; cursor: pointer; }
        .toggle-switch { width: 30px; height: 16px; background: #333; border-radius: 10px; position: relative; cursor: pointer; transition: 0.2s; }
        .toggle-switch.on { background: #4a90e2; }
        .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: #fff; border-radius: 50%; transition: 0.2s; }
        .toggle-switch.on::after { left: 16px; }
        
        .send-btn { width: 32px; height: 32px; border-radius: 50%; background: #4a90e2; border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. Sidebar -->
    <div class="sidebar" id="sidebar">
        <input type="text" class="search-bar" placeholder="Search sessions...">
        <div class="session-list" id="sessionList"></div>
        <div class="sidebar-footer">
            <span class="username">CEO User</span>
            <span class="settings-btn">•••</span>
        </div>
    </div>

    <!-- 2. Overlay (ဒီ Overlay ကို နှိပ်ရင် ပြန်ပိတ်သွားပါမယ်) -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- 3. Main App Container -->
    <div class="app-container" id="appContainer">
        
        <div class="header">
            <div class="menu-btn" onclick="toggleSidebar()">☰</div>
            <div class="header-center">
                <div class="header-title">AI Architect</div>
                <div class="header-mode" id="headerMode">General</div>
            </div>
            <div class="new-chat-btn" onclick="newChat()">+</div>
        </div>

        <div class="chat-area">
            <div class="empty-state" id="emptyState">
                <div class="logo-placeholder">AI</div>
                <div class="empty-text" id="emptyText">Start chatting with General</div>
                <div class="mode-pills">
                    <div class="pill-btn active" id="pillGeneral" onclick="setMode('General')">General</div>
                    <div class="pill-btn" id="pillProfessional" onclick="setMode('Professional')">Professional</div>
                </div>
            </div>
            <div class="active-chat" id="activeChat"></div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <div class="input-top-row">
                    <textarea id="chatInput" rows="1" placeholder="Type a message or hold to speak"></textarea>
                </div>
                <div class="input-bottom-row">
                    <div class="bottom-left">
                        <button class="action-icon-btn" onclick="document.getElementById('fileInput').click()">+</button>
                        <input type="file" id="fileInput" style="display:none" accept="image/*, .pdf, .txt">
                    </div>
                    <div class="bottom-right">
                        <div class="debate-toggle" onclick="toggleDebate()">
                            <span>Debate</span>
                            <div class="toggle-switch" id="debateSwitch"></div>
                        </div>
                        <button class="send-btn" onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let isDebateOn = false;
        let currentMode = 'General';

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const appContainer = document.getElementById('appContainer');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
            appContainer.classList.toggle('sidebar-open');
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('headerMode').innerText = mode;
            document.getElementById('emptyText').innerText = `Start chatting with ${mode}`;
            document.getElementById('pillGeneral').classList.remove('active');
            document.getElementById('pillProfessional').classList.remove('active');
            document.getElementById(mode === 'General' ? 'pillGeneral' : 'pillProfessional').classList.add('active');
        }

        function newChat() {
            document.getElementById('activeChat').style.display = 'none';
            document.getElementById('activeChat').innerHTML = '';
            document.getElementById('emptyState').style.display = 'flex';
            document.getElementById('chatInput').value = '';
            document.getElementById('chatInput').style.height = 'auto'; 
            if(document.getElementById('sidebar').classList.contains('open')) {
                toggleSidebar();
            }
        }

        function toggleDebate() {
            isDebateOn = !isDebateOn;
            document.getElementById('debateSwitch').classList.toggle('on');
        }

        const chatInput = document.getElementById('chatInput');
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto'; 
            this.style.height = (this.scrollHeight) + 'px'; 
        });

        function sendMessage() {
            const input = document.getElementById('chatInput').value;
            if(!input.trim()) return;

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('activeChat').style.display = 'flex';

            const chatContainer = document.getElementById('activeChat');
            const userMsg = document.createElement('div');
            userMsg.className = 'message-row user';
            userMsg.innerHTML = `<div class="message-bubble user">${input}</div>`;
            chatContainer.appendChild(userMsg);

            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message-row ai';
                aiMsg.innerHTML = `
                    <div class="message-bubble ai">
                        Mock response from AI.<br><br>
                        <div class="ai-actions">
                            <span onclick="alert('Copied!')">📋 Copy</span>
                            <span onclick="alert('Downloaded!')">📥 Download</span>
                        </div>
                    </div>
                `;
                chatContainer.appendChild(aiMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 500);

            document.getElementById('chatInput').value = '';
            document.getElementById('chatInput').style.height = 'auto';
        }
    </script>
</body>
</html>
